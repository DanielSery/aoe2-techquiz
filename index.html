<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AoE2 Tech Quiz</title>
<meta name="description" content="Learn which Age of Empires II civilisations have which units and upgrades.">
<link rel="stylesheet" href="css/style.css?v=38">
<link rel="icon" href="img/topics/unit-5.png">
</head>
<body>

<svg class="sprites" aria-hidden="true">
  <symbol id="mark-full" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="mark-partial" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 3.5a8.5 8.5 0 000 17z" fill="currentColor"/></symbol>
  <symbol id="mark-none" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
  <symbol id="mark-right" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 6.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="mark-wrong" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
  <symbol id="icon-replay" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9M20 3v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M6 10v10h12V10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-board" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 01-10 0zM7 6H4v2a3 3 0 003 3M17 6h3v2a3 3 0 01-3 3M9 20h6M12 14v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-learn" viewBox="0 0 24 24"><path d="M4 5.5A2.5 2.5 0 016.5 3H19v14H6.5A2.5 2.5 0 004 19.5zM19 17v4H6.5A2.5 2.5 0 014 18.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 7v5.4l3.4 2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6.1L12 16.8 6.6 19.7l1.2-6.1L3.3 9.4l6.1-.8z" fill="currentColor"/></symbol>
  <symbol id="icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor"/></symbol>
  <symbol id="icon-custom" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="icon-single" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="3" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="icon-all" viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="3" width="8" height="8" rx="2" fill="currentColor"/><rect x="3" y="13" width="8" height="8" rx="2" fill="currentColor"/><rect x="13" y="13" width="8" height="8" rx="2" fill="currentColor"/></symbol>
</svg>

<main>

  <section id="menu" class="screen is-active">
    <h1><img src="img/topics/unit-5.png" alt=""><span>Tech Quiz</span></h1>
    <p class="lede">Pick your topics, then say what each civilisation gets.</p>
    <div id="topic-grid" class="topic-grid"></div>
    <div class="modes" id="modes">
      <button class="mode" data-mode="single" aria-pressed="true">
        <svg><use href="#icon-single"/></svg><span>Single</span>
      </button>
      <button class="mode" data-mode="custom" aria-pressed="false">
        <svg><use href="#icon-custom"/></svg><span>Custom</span>
      </button>
      <button class="mode" data-mode="all" aria-pressed="false">
        <svg><use href="#icon-all"/></svg><span>All</span>
      </button>
    </div>

    <div class="games" id="games">
      <button class="game" data-game="play" aria-pressed="true">
        <svg><use href="#icon-play"/></svg><span>Play</span>
      </button>
      <button class="game" data-game="learn" aria-pressed="false">
        <svg><use href="#icon-learn"/></svg><span>Learn</span>
      </button>
    </div>

    <p id="pool-note" class="pool-note"></p>

    <div class="menu-actions">
      <button id="clear-data" class="ghost danger" title="Clear all saved data"><svg><use href="#icon-trash"/></svg></button>
      <button id="to-board" class="ghost" title="Best rounds"><svg><use href="#icon-board"/></svg></button>
      <button id="start" class="primary" disabled><svg><use href="#icon-play"/></svg><span id="start-count"></span></button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="hud">
      <button id="quit" class="ghost" title="Back to topics"><svg><use href="#icon-home"/></svg></button>
      <div id="progress" class="progress"></div>
      <div id="clock" class="clock" hidden><svg><use href="#icon-clock"/></svg><b>30</b></div>
      <div class="tally"><b id="score-now">0</b><span id="delta" class="delta"></span></div>
      <i id="clock-bar" class="clock-bar"></i>
    </div>

    <div class="arena">
      <div id="stack" class="stack"></div>
      <div id="burst" class="burst"></div>

    </div>

    <div id="pad" class="pad"></div>
  </section>

  <section id="results" class="screen">
    <div class="score">
      <b id="final-score"></b>
      <small id="final-tally"></small>
      <p id="final-note" class="final-note"></p>
    </div>
    <div id="review" class="review"></div>
    <div class="actions">
      <button id="see-board" class="ghost" title="Best rounds" hidden><svg><use href="#icon-board"/></svg></button>
      <button id="again-wrong" class="primary"><svg><use href="#icon-replay"/></svg><span id="wrong-count"></span></button>
      <button id="again-all" class="ghost"><svg><use href="#icon-replay"/></svg><span id="all-count"></span></button>
      <button id="to-menu" class="ghost"><svg><use href="#icon-home"/></svg></button>
    </div>
  </section>

  <section id="scores" class="screen">
    <h2 class="board-title"><svg><use href="#icon-board"/></svg> Best rounds</h2>
    <ol id="scoreboard" class="scoreboard"></ol>
    <div class="actions">
      <button id="board-back" class="ghost"><svg><use href="#icon-home"/></svg></button>
    </div>
  </section>

</main>

<footer>
  Game data from <a href="https://github.com/SiegeEngineers/aoe2techtree">aoe2techtree</a>.
  Age of Empires II artwork &copy; Microsoft. Fan project, not affiliated with Microsoft.
</footer>

<script src="data/topics.js?v=38"></script>
<script src="js/data.js?v=38"></script>
<script src="js/app.js?v=38"></script>
</body>
</html>
